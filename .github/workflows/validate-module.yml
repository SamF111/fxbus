name: Validate Module

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate FX Bus module files and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Show tool versions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          python3 --version
          jq --version
          zip --version | head -n 2

      - name: Validate development files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "package.json"
            "package-lock.json"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Required development file missing: $file"
              exit 1
            fi
          done

          if [ ! -d "tests" ]; then
            echo "::error::Jest tests folder missing: tests/"
            exit 1
          fi

          if ! jq -e '.scripts.test | type == "string" and length > 0' package.json > /dev/null; then
            echo "::error::package.json must define a non-empty scripts.test command"
            exit 1
          fi

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Run Jest tests
        shell: bash
        run: |
          set -euo pipefail
          npm test -- --ci --runInBand

      - name: Validate module.json syntax
        shell: bash
        run: |
          set -euo pipefail
          jq . module.json > /dev/null

      - name: Validate required module.json fields
        shell: bash
        run: |
          set -euo pipefail

          required_fields=(
            ".id"
            ".title"
            ".description"
            ".version"
            ".authors"
            ".compatibility.minimum"
            ".compatibility.verified"
            ".esmodules"
            ".styles"
            ".socket"
            ".manifest"
            ".download"
          )

          for field in "${required_fields[@]}"; do
            value="$(jq -r "$field // empty" module.json)"

            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "::error::module.json is missing required field: $field"
              exit 1
            fi
          done

      - name: Validate module id and release download filename
        shell: bash
        run: |
          set -euo pipefail

          module_id="$(jq -r '.id' module.json)"
          version="$(jq -r '.version' module.json)"
          manifest="$(jq -r '.manifest' module.json)"
          download="$(jq -r '.download' module.json)"

          if [ "$module_id" != "fxbus" ]; then
            echo "::error::module.json id must be fxbus, got: $module_id"
            exit 1
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::module.json version must look like 0.7.0, got: $version"
            exit 1
          fi

          expected_manifest="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/module.json"
          expected_download="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/fxbus.zip"

          if [ "$manifest" != "$expected_manifest" ]; then
            echo "::error::manifest URL must be: $expected_manifest"
            echo "::error::got: $manifest"
            exit 1
          fi

          if [ "$download" != "$expected_download" ]; then
            echo "::error::download URL must be: $expected_download"
            echo "::error::got: $download"
            exit 1
          fi

      - name: Validate manifest file references
        shell: bash
        run: |
          set -euo pipefail

          jq -r '.esmodules[]' module.json | while read -r file; do
            if [ ! -f "$file" ]; then
              echo "::error::module.json references missing esmodule: $file"
              exit 1
            fi
          done

          jq -r '.styles[]' module.json | while read -r file; do
            if [ ! -f "$file" ]; then
              echo "::error::module.json references missing stylesheet: $file"
              exit 1
            fi
          done

          if [ ! -f "README.md" ]; then
            echo "::error::README.md missing"
            exit 1
          fi

          if [ ! -f "LICENSE" ]; then
            echo "::error::LICENSE missing"
            exit 1
          fi

      - name: Validate expected folders exist
        shell: bash
        run: |
          set -euo pipefail

          expected_dirs=(
            "scripts"
            "styles"
            "templates"
            "tests"
          )

          for dir in "${expected_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "::error::Expected folder missing: $dir"
              exit 1
            fi
          done

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t js_files < <(
            find scripts tests -type f -name "*.js" | sort
          )

          if [ "${#js_files[@]}" -eq 0 ]; then
            echo "::error::No JavaScript files found under scripts/ or tests/"
            exit 1
          fi

          for file in "${js_files[@]}"; do
            echo "Checking JavaScript syntax: $file"
            node --check "$file"
          done

      - name: Validate local JavaScript imports exist
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/check-js-imports.py <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(".").resolve()
          source_directories = [
              root / "scripts",
              root / "tests",
          ]

          import_pattern = re.compile(
              r"""(?:import\s+(?:[^'"]+\s+from\s+)?|export\s+[^'"]+\s+from\s+)["']([^"']+)["']"""
          )

          ok = True

          for source_directory in source_directories:
              for path in sorted(source_directory.rglob("*.js")):
                  text = path.read_text(encoding="utf-8")

                  for match in import_pattern.finditer(text):
                      specifier = match.group(1)

                      if not specifier.startswith("."):
                          continue

                      target = (path.parent / specifier).resolve()

                      candidates = [
                          target,
                          target.with_suffix(".js") if target.suffix == "" else target,
                          target / "index.js",
                      ]

                      if not any(candidate.exists() for candidate in candidates):
                          relative_path = path.relative_to(root)
                          print(
                              f"::error file={relative_path}::"
                              f"Missing local import target: {specifier}"
                          )
                          ok = False

          if not ok:
              sys.exit(1)
          PY

          python3 /tmp/check-js-imports.py

      - name: Validate Handlebars templates
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t hbs_files < <(
            find templates -type f -name "*.hbs" | sort
          )

          if [ "${#hbs_files[@]}" -eq 0 ]; then
            echo "::error::No Handlebars templates found under templates/"
            exit 1
          fi

          for file in "${hbs_files[@]}"; do
            echo "Checking template: $file"

            if [ ! -s "$file" ]; then
              echo "::error file=$file::Template is empty"
              exit 1
            fi
          done

      - name: Validate template partial references exist
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/check-hbs-partials.py <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(".").resolve()
          templates = root / "templates"

          partial_pattern = re.compile(
              r"""\{\{>\s+["']([^"']+)["']\s*\}\}"""
          )

          ok = True

          for path in sorted(templates.rglob("*.hbs")):
              text = path.read_text(encoding="utf-8")

              for match in partial_pattern.finditer(text):
                  partial = match.group(1)

                  if partial.startswith("modules/fxbus/"):
                      target = root / partial.removeprefix("modules/fxbus/")
                  else:
                      target = path.parent / partial

                  if not target.exists():
                      relative_path = path.relative_to(root)
                      print(
                          f"::error file={relative_path}::"
                          f"Missing Handlebars partial: {partial}"
                      )
                      ok = False

          if not ok:
              sys.exit(1)
          PY

          python3 /tmp/check-hbs-partials.py

      - name: Build validation zip
        shell: bash
        run: |
          set -euo pipefail

          rm -f fxbus.zip

          zip_args=(
            fxbus.zip
            module.json
            README.md
            LICENSE
            scripts
            styles
            templates
          )

          if [ -d "assets" ]; then
            zip_args+=(assets)
          fi

          zip -r "${zip_args[@]}" \
            -x "*.git*" \
            -x "*.github*" \
            -x "tests/*" \
            -x "node_modules/*" \
            -x "package.json" \
            -x "package-lock.json"

          if [ ! -s "fxbus.zip" ]; then
            echo "::error::fxbus.zip was not created"
            exit 1
          fi

          unzip -l fxbus.zip

      - name: Validate zip contents
        shell: bash
        run: |
          set -euo pipefail

          required_archive_entries=(
            "module.json"
            "README.md"
            "LICENSE"
          )

          for entry in "${required_archive_entries[@]}"; do
            if ! unzip -Z1 fxbus.zip | grep -Fxq "$entry"; then
              echo "::error::fxbus.zip is missing required file: $entry"
              exit 1
            fi
          done

          forbidden_pattern='^(\.github/|tests/|node_modules/)|^(package\.json|package-lock\.json)$'

          if unzip -Z1 fxbus.zip | grep -Eq "$forbidden_pattern"; then
            echo "::error::fxbus.zip contains development-only files"
            unzip -Z1 fxbus.zip | grep -E "$forbidden_pattern"
            exit 1
          fi
